version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      androidx-compose:
        patterns:
          - "androidx.compose*"
          - "androidx.activity*"
          - "androidx.lifecycle*"
          - "androidx.navigation*"
      gradle-and-plugins:
        patterns:
          - "com.android.tools*"
          - "org.jetbrains.kotlin*"
          - "com.google.devtools.ksp*"
