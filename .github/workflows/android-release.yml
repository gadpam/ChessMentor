name: Android release draft

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.tag.outputs.version_name }}
      code: ${{ steps.tag.outputs.version_code }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Require a release tag on master history
        id: tag
        run: |
          git merge-base --is-ancestor HEAD origin/master || { echo 'Tag must point to a commit on master'; exit 1; }
          python3 .github/scripts/release_version.py "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

  ci:
    needs: version
    uses: ./.github/workflows/android-ci.yml
    with:
      version_name: ${{ needs.version.outputs.name }}
      version_code: ${{ needs.version.outputs.code }}

  draft:
    needs: [ci, version]
    runs-on: ubuntu-latest
    environment: android-release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: chessmentor-apks
          path: artifacts
      - name: Prepare Android signing tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"'
      - name: Align, sign and verify the tested release APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ needs.version.outputs.code }}
          VERSION_NAME: ${{ needs.version.outputs.name }}
        run: |
          set -euo pipefail
          umask 077
          tools="$ANDROID_HOME/build-tools/35.0.0"
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          printf '%s' "${KEYSTORE_B64:?missing keystore}" | base64 --decode > "$tmp/signing.jks"
          apk="ChessMentor-$GITHUB_REF_NAME.apk"
          "$tools/zipalign" -P 16 -f 4 artifacts/apk/release/app-release-unsigned.apk "$tmp/aligned.apk"
          "$tools/apksigner" sign --ks "$tmp/signing.jks" --ks-key-alias "${KEY_ALIAS:?missing alias}" \
            --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD --out "$apk" "$tmp/aligned.apk"
          "$tools/apksigner" verify --verbose --print-certs "$apk"
          "$tools/zipalign" -c -P 16 4 "$apk"
          "$tools/aapt" dump badging "$apk" > "$tmp/badging"
          grep -F "package: name='com.example.chessmentor' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'" "$tmp/badging"
          sha256sum "$apk" > "$apk.sha256"
      - name: Create draft (never publish or overwrite an existing release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--draft --verify-tag --generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-rc.* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "${flags[@]}" \
            --title "ChessMentor $GITHUB_REF_NAME" "ChessMentor-$GITHUB_REF_NAME.apk" "ChessMentor-$GITHUB_REF_NAME.apk.sha256"
