name: Android release draft

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

env:
  SIGNING_BUILD_TOOLS_VERSION: "35.0.0"

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      name: ${{ steps.tag.outputs.version_name }}
      code: ${{ steps.tag.outputs.version_code }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Require a release tag on master history
        id: tag
        run: |
          git merge-base --is-ancestor HEAD origin/master || { echo 'Tag must point to a commit on master'; exit 1; }
          python3 .github/scripts/release_version.py "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

  ci:
    needs: version
    uses: ./.github/workflows/android-ci.yml
    with:
      version_name: ${{ needs.version.outputs.name }}
      version_code: ${{ needs.version.outputs.code }}

  draft:
    needs: [ci, version]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: android-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: chessmentor-apks
          path: artifacts
      - name: Prepare Android signing tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;${SIGNING_BUILD_TOOLS_VERSION}"'
      - name: Align, sign and verify the tested release APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ needs.version.outputs.code }}
          VERSION_NAME: ${{ needs.version.outputs.name }}
        run: bash .github/scripts/sign-apk.sh artifacts/apk/release/app-release-unsigned.apk "ChessMentor-$GITHUB_REF_NAME.apk"
      - name: Collect R8 mapping & native debug symbols for release crash analysis
        run: |
          set -euo pipefail
          if [[ -f artifacts/mapping/release/mapping.txt ]]; then
            cp artifacts/mapping/release/mapping.txt "ChessMentor-$GITHUB_REF_NAME-mapping.txt"
            sha256sum "ChessMentor-$GITHUB_REF_NAME-mapping.txt" > "ChessMentor-$GITHUB_REF_NAME-mapping.txt.sha256"
          fi
          if [[ -f artifacts/native-debug-symbols/release/native-debug-symbols.zip ]]; then
            cp artifacts/native-debug-symbols/release/native-debug-symbols.zip "ChessMentor-$GITHUB_REF_NAME-native-debug-symbols.zip"
            sha256sum "ChessMentor-$GITHUB_REF_NAME-native-debug-symbols.zip" > "ChessMentor-$GITHUB_REF_NAME-native-debug-symbols.zip.sha256"
          fi
      - name: Create draft (never publish or overwrite an existing release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          flags=(--draft --verify-tag --generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-rc.* ]]; then flags+=(--prerelease); fi
          assets=("ChessMentor-$GITHUB_REF_NAME.apk" "ChessMentor-$GITHUB_REF_NAME.apk.sha256")
          for extra in \
            "ChessMentor-$GITHUB_REF_NAME-mapping.txt" \
            "ChessMentor-$GITHUB_REF_NAME-mapping.txt.sha256" \
            "ChessMentor-$GITHUB_REF_NAME-native-debug-symbols.zip" \
            "ChessMentor-$GITHUB_REF_NAME-native-debug-symbols.zip.sha256"; do
            if [[ -f "$extra" ]]; then assets+=("$extra"); fi
          done
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "${flags[@]}" \
            --title "ChessMentor $GITHUB_REF_NAME" "${assets[@]}"
