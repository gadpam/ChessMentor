name: Android CI

on:
  push:
    branches:
      - master
      - "arena/**"
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      emulator_api_level:
        description: "Android Emulator API level for device tests"
        type: choice
        default: "29"
        options:
          - "29"
          - "34"
          - "35"
      verbose_logs:
        description: "Enable verbose Gradle --info logging"
        type: boolean
        default: false
  workflow_call:
    inputs:
      version_name:
        type: string
        default: "1.0"
      version_code:
        type: string
        default: "1"

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  NDK_VERSION: "26.1.10909125"
  CMAKE_VERSION: "3.22.1"
  SIGNING_BUILD_TOOLS_VERSION: "35.0.0"
  NNUE_NET_NAME: "nn-1a298aa575a0.nnue"
  NNUE_SHA256_PREFIX: "1a298aa575a0"

jobs:
  test-and-lint:
    name: Unit Tests, Room Schema & Android Lint
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Run Python preflight & CI script tests
        run: |
          python3 -m unittest discover -s .github/scripts -p "test_*.py" -v
          python3 .github/scripts/ci_preflight.py

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Ensure Android SDK, NDK & CMake components
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

      - name: Cache Stockfish CMake/NDK build outputs
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: app/.cxx
          key: ndk-lint-${{ runner.os }}-${{ env.NDK_VERSION }}-${{ env.CMAKE_VERSION }}-${{ hashFiles('app/src/main/cpp/**', 'app/build.gradle.kts') }}
          restore-keys: |
            ndk-lint-${{ runner.os }}-${{ env.NDK_VERSION }}-${{ env.CMAKE_VERSION }}-

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Diagnose build environment
        run: |
          echo "=== ANDROID_HOME=$ANDROID_HOME ==="
          ls -la "$ANDROID_HOME" || true
          echo "=== Memory & CPU ==="
          nproc && free -h
          echo "=== Installed SDK components ==="
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --list_installed || true
          echo "=== Java & Gradle version ==="
          java -version || true
          ./gradlew --version || true
          DIST_SHA=$(curl -sSfL https://services.gradle.org/distributions/gradle-8.5-bin.zip.sha256 || true)
          if [ -n "$DIST_SHA" ]; then
            echo "::notice title=Gradle85Sha256::$DIST_SHA"
          fi

      - name: Run JVM unit tests
        run: |
          set -o pipefail
          EXTRA_FLAG=""
          if [ "${{ inputs.verbose_logs }}" = "true" ]; then EXTRA_FLAG="--info"; fi
          ./gradlew testDebugUnitTest --no-daemon --stacktrace --warning-mode=all ${EXTRA_FLAG} -Dorg.gradle.jvmargs="-Xmx3072m -Dfile.encoding=UTF-8" 2>&1 | tee /tmp/gradle-test.log || {
            STATUS=$?
            python3 - /tmp/gradle-test.log "$GITHUB_WORKSPACE" <<'PY'
          import glob, re, sys, xml.etree.ElementTree as ET
          log = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          ws = sys.argv[2].rstrip("/") + "/"
          emitted = 0
          for m in re.finditer(r"^e: file://([^:\n]+):(\d+):(\d+)\s+(.+)$", log, re.M):
              rel = m.group(1).replace(ws, "")
              print(f"::error file={rel},line={m.group(2)},col={m.group(3)},title=Kotlin::{m.group(4)}")
              emitted += 1
              if emitted >= 25: break
          for m in re.finditer(r"^e: \[ksp\]\s+(.+)$", log, re.M):
              print(f"::error title=KSP::{m.group(1)}")
              emitted += 1
              if emitted >= 25: break
          for xml_path in sorted(glob.glob("app/build/test-results/testDebugUnitTest/*.xml")):
              root = ET.parse(xml_path).getroot()
              for tc in root.findall("testcase"):
                  for fail in list(tc.findall("failure")) + list(tc.findall("error")):
                      first_lines = " | ".join((fail.text or fail.attrib.get("message", "")).splitlines()[:4])
                      print(f"::error title=Test {tc.attrib.get('classname')}.{tc.attrib.get('name')}::{first_lines[:400]}")
                      emitted += 1
          failure_idx = log.rfind("FAILURE: Build failed with an exception.")
          excerpt = log[failure_idx:].splitlines()[:45] if failure_idx != -1 else log.splitlines()[-60:]
          for i in range(0, len(excerpt), 15):
              chunk = " | ".join(l.strip() for l in excerpt[i:i+15] if l.strip())
              if chunk:
                  print(f"::error title=GradleTail::{chunk[:1200]}")
          PY
            exit $STATUS
          }
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          files = sorted(glob.glob("app/build/test-results/testDebugUnitTest/*.xml"))
          tests = sum(int(ET.parse(f).getroot().attrib.get("tests", 0)) for f in files)
          failures = sum(int(ET.parse(f).getroot().attrib.get("failures", 0)) for f in files)
          errors = sum(int(ET.parse(f).getroot().attrib.get("errors", 0)) for f in files)
          print(f"::notice title=UnitTests::Passed {tests} tests across {len(files)} classes (failures={failures}, errors={errors})")
          PY

      - name: Verify exported Room v5 schema
        run: |
          SCHEMA_FILE="app/schemas/com.example.chessmentor.data.local.AppDatabase/5.json"
          test -f "$SCHEMA_FILE" || (echo "::error title=RoomSchema::Missing $SCHEMA_FILE" && exit 1)
          python3 - "$SCHEMA_FILE" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          db = data["database"]
          assert db["version"] == 5, f"Expected Room version 5, got {db['version']}"
          tables = sorted(e["tableName"] for e in db["entities"])
          expected = ["analyzed_moves", "exercise_attempts", "exercises", "games", "mistakes", "users"]
          assert tables == expected, f"Unexpected Room tables: {tables}"
          print(f"::notice title=RoomSchema::Verified v{db['version']} ({len(tables)} tables, identityHash={db['identityHash']})")
          PY
          git diff --exit-code -- app/schemas/ || {
            echo "::error file=$SCHEMA_FILE,title=RoomSchemaDrift::Room schema changed without updating committed app/schemas/ (and migration if needed)."
            exit 1
          }

      - name: Run Android Lint
        run: |
          set -o pipefail
          ./gradlew lintDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx3072m -Dfile.encoding=UTF-8" 2>&1 | tee /tmp/gradle-lint.log || {
            STATUS=$?
            python3 - "$GITHUB_WORKSPACE" /tmp/gradle-lint.log <<'PY'
          import os, sys, xml.etree.ElementTree as ET
          ws = sys.argv[1].rstrip("/") + "/"
          xml_file = "app/build/reports/lint-results-debug.xml"
          emitted = 0
          if os.path.exists(xml_file):
              for issue in ET.parse(xml_file).getroot().findall("issue"):
                  if issue.attrib.get("severity") in ("Error", "Fatal"):
                      loc = issue.find("location")
                      f = (loc.attrib.get("file", "") if loc is not None else "").replace(ws, "")
                      ln = loc.attrib.get("line", "1") if loc is not None else "1"
                      msg = f"[{issue.attrib.get('id')}] {issue.attrib.get('message', '')}"
                      if f:
                          print(f"::error file={f},line={ln},title=AndroidLint::{msg[:400]}")
                      else:
                          print(f"::error title=AndroidLint::{msg[:400]}")
                      emitted += 1
                      if emitted >= 30: break
          if emitted == 0:
              log = open(sys.argv[2], encoding="utf-8", errors="replace").read()
              tail = " | ".join(l.strip() for l in log.splitlines()[-30:] if l.strip())
              print(f"::error title=LintGradle::{tail[:900]}")
          PY
            exit $STATUS
          }

      - name: Compile Android instrumentation tests
        run: |
          set -o pipefail
          ./gradlew :app:compileDebugAndroidTestKotlin --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx3072m -Dfile.encoding=UTF-8" 2>&1 | tee /tmp/gradle-androidtest.log || {
            STATUS=$?
            python3 - /tmp/gradle-androidtest.log "$GITHUB_WORKSPACE" <<'PY'
          import re, sys
          log = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          ws = sys.argv[2].rstrip("/") + "/"
          emitted = 0
          for m in re.finditer(r"^e: file://([^:\n]+):(\d+):(\d+)\s+(.+)$", log, re.M):
              rel = m.group(1).replace(ws, "")
              print(f"::error file={rel},line={m.group(2)},col={m.group(3)},title=AndroidTestKotlin::{m.group(4)}")
              emitted += 1
              if emitted >= 30: break
          if emitted == 0:
              tail = " | ".join(l.strip() for l in log.splitlines()[-30:] if l.strip())
              print(f"::error title=AndroidTestKotlin::{tail[:1200]}")
          PY
            exit $STATUS
          }

      - name: Upload test, lint & Room schema artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: test-lint-and-room-schema
          retention-days: 14
          if-no-files-found: ignore
          path: |
            app/build/reports/tests/testDebugUnitTest/**
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/reports/lint-results-debug.*
            app/schemas/**

  build-apks:
    name: Build Debug & R8 Release APKs (Stockfish NDK)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Ensure Android SDK, NDK & CMake components
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

      - name: Cache Stockfish CMake/NDK build outputs
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: app/.cxx
          key: ndk-${{ runner.os }}-${{ env.NDK_VERSION }}-${{ env.CMAKE_VERSION }}-${{ hashFiles('app/src/main/cpp/**', 'app/build.gradle.kts') }}
          restore-keys: |
            ndk-${{ runner.os }}-${{ env.NDK_VERSION }}-${{ env.CMAKE_VERSION }}-

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Assemble Debug & R8-minified Release APKs
        env:
          ORG_GRADLE_PROJECT_releaseVersionName: ${{ inputs.version_name || '1.0' }}
          ORG_GRADLE_PROJECT_releaseVersionCode: ${{ inputs.version_code || '1' }}
        run: |
          set -o pipefail
          EXTRA_FLAG=""
          if [ "${{ inputs.verbose_logs }}" = "true" ]; then EXTRA_FLAG="--info"; fi
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace --warning-mode=all ${EXTRA_FLAG} -Dorg.gradle.jvmargs="-Xmx3072m -Dfile.encoding=UTF-8" 2>&1 | tee /tmp/gradle-apk.log || {
            STATUS=$?
            python3 - /tmp/gradle-apk.log "$GITHUB_WORKSPACE" <<'PY'
          import re, sys
          log = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          ws = sys.argv[2].rstrip("/") + "/"
          emitted = 0
          for m in re.finditer(r"^e: file://([^:\n]+):(\d+):(\d+)\s+(.+)$", log, re.M):
              rel = m.group(1).replace(ws, "")
              print(f"::error file={rel},line={m.group(2)},col={m.group(3)},title=Kotlin::{m.group(4)}")
              emitted += 1
              if emitted >= 25: break
          for m in re.finditer(r"^([^\s:]+):(\d+):(\d+):\s+error:\s+(.+)$", log, re.M):
              rel = m.group(1).replace(ws, "")
              print(f"::error file={rel},line={m.group(2)},title=NDK::{m.group(4)}")
              emitted += 1
              if emitted >= 25: break
          for m in re.finditer(r"(?:Missing class .+|ERROR:\s*R8:.+|e: \[ksp\] .+)", log):
              print(f"::error title=Build::{m.group(0)[:400]}")
              emitted += 1
              if emitted >= 25: break
          failure_idx = log.rfind("FAILURE: Build failed with an exception.")
          excerpt = log[failure_idx:].splitlines()[:45] if failure_idx != -1 else log.splitlines()[-60:]
          for i in range(0, len(excerpt), 15):
              chunk = " | ".join(l.strip() for l in excerpt[i:i+15] if l.strip())
              if chunk:
                  print(f"::error title=AssembleGradleTail::{chunk[:1200]}")
          PY
            exit $STATUS
          }

      - name: Verify 16 KB ELF page alignment on libstockfish-lib.so (Android 15+)
        run: |
          READELF="${ANDROID_HOME}/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          SO_FILES=$(find app/build/intermediates/merged_native_libs -name "libstockfish-lib.so")
          test -n "$SO_FILES" || (echo "::error title=ELF16KB::No libstockfish-lib.so found" && exit 1)
          for so in $SO_FILES; do
            python3 - "$READELF" "$so" <<'PY'
          import re, subprocess, sys
          out = subprocess.check_output([sys.argv[1], "-l", sys.argv[2]], text=True)
          aligns = [int(m.group(1), 16) for m in re.finditer(r"^\s*LOAD\b.*?(0x[0-9a-fA-F]+)\s*$", out, re.M)]
          assert aligns, f"No LOAD segments in {sys.argv[2]}"
          bad = [hex(a) for a in aligns if a < 0x4000]
          assert not bad, f"{sys.argv[2]} has LOAD alignment < 16KB: {bad}"
          print(f"Verified 16KB alignment on {sys.argv[2]}: {[hex(a) for a in aligns]}")
          PY
          done
          python3 - <<'PY'
          import glob, os
          apks = sorted(glob.glob("app/build/outputs/apk/*/*.apk"))
          parts = [f"{os.path.basename(p)}={os.path.getsize(p)/1_048_576:.2f} MB" for p in apks]
          mapping_ok = os.path.isfile("app/build/outputs/mapping/release/mapping.txt")
          sym_ok = os.path.isfile("app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip")
          print(f"::notice title=APKsAnd16KB::{', '.join(parts)} | R8 mapping={mapping_ok} | nativeSymbols={sym_ok} | 16KB ELF verified (arm64-v8a, x86_64)")
          PY

      - name: Upload Debug APK, Release APK & R8 mapping
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: chessmentor-apks
          retention-days: 14
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
            app/build/outputs/native-debug-symbols/release/*.zip

      - name: Archive Release R8 mapping & native debug symbols (90d retention)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: chessmentor-release-symbols
          retention-days: 90
          if-no-files-found: warn
          path: |
            app/build/outputs/mapping/release/mapping.txt
            app/build/outputs/native-debug-symbols/release/*.zip

  signing-smoke:
    name: Verify release signing with a disposable key
    needs: build-apks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: chessmentor-apks
          path: artifacts
      - name: Prepare Android signing tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;${SIGNING_BUILD_TOOLS_VERSION}"'
      - name: Sign and verify a temporary copy (no release secrets)
        env:
          VERSION_NAME: ${{ inputs.version_name || '1.0' }}
          VERSION_CODE: ${{ inputs.version_code || '1' }}
        run: |
          set -euo pipefail
          umask 077
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          STORE_PASSWORD=$(openssl rand -hex 24)
          export STORE_PASSWORD KEY_PASSWORD="$STORE_PASSWORD" KEY_ALIAS=ci-smoke
          keytool -genkeypair -noprompt -storetype JKS -keystore "$tmp/test.jks" \
            -alias "$KEY_ALIAS" -storepass:env STORE_PASSWORD -keypass:env KEY_PASSWORD \
            -keyalg RSA -keysize 2048 -validity 1 -dname 'CN=CI signing test'
          KEYSTORE_B64=$(base64 -w0 "$tmp/test.jks") \
            bash .github/scripts/sign-apk.sh artifacts/apk/release/app-release-unsigned.apk "$tmp/test.apk"

  room-device-test:
    name: Instrumentation & Room Device Tests
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Ensure Android SDK, NDK & CMake components
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"
      - name: Cache Stockfish CMake/NDK build outputs
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: app/.cxx
          key: ndk-device-${{ runner.os }}-${{ env.NDK_VERSION }}-${{ env.CMAKE_VERSION }}-${{ hashFiles('app/src/main/cpp/**', 'app/build.gradle.kts') }}
          restore-keys: |
            ndk-device-${{ runner.os }}-${{ env.NDK_VERSION }}-${{ env.CMAKE_VERSION }}-
      - name: Cache NNUE model for offline emulator tests
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: /tmp/nnue-cache
          key: nnue-${{ env.NNUE_NET_NAME }}-${{ env.NNUE_SHA256_PREFIX }}
      - name: Pre-fetch & verify NNUE model on runner
        run: |
          set -euo pipefail
          mkdir -p /tmp/nnue-cache
          target="/tmp/nnue-cache/${NNUE_NET_NAME}"
          if [[ ! -s "$target" ]]; then
            for url in \
              "https://tests.stockfishchess.org/api/nn/${NNUE_NET_NAME}" \
              "https://github.com/official-stockfish/networks/raw/master/${NNUE_NET_NAME}"; do
              if curl -fsSL --retry 2 --connect-timeout 15 --max-time 180 "$url" -o "$target.part"; then
                actual_prefix=$(sha256sum "$target.part" | cut -c1-12)
                if [[ "$actual_prefix" == "${NNUE_SHA256_PREFIX}" ]]; then
                  mv "$target.part" "$target"
                  break
                fi
                rm -f "$target.part"
              fi
            done
          fi
          if [[ -s "$target" ]]; then
            echo "Cached NNUE verified: $target ($(stat -c%s "$target") bytes)"
          else
            echo "::warning::Could not pre-cache NNUE on runner; emulator test will fall back to in-app download."
          fi
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Build application and tests before booting the emulator
        env:
          ORG_GRADLE_PROJECT_releaseVersionName: ${{ inputs.version_name || '1.0' }}
          ORG_GRADLE_PROJECT_releaseVersionCode: ${{ inputs.version_code || '1' }}
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest -Pandroid.injected.build.abi=x86_64 --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx3072m -Dfile.encoding=UTF-8" 2>&1 | tee /tmp/gradle-device-build.log || {
            STATUS=$?
            python3 - /tmp/gradle-device-build.log "$GITHUB_WORKSPACE" <<'PY'
          import re, sys
          log = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          ws = sys.argv[2].rstrip("/") + "/"
          emitted = 0
          for m in re.finditer(r"^e: file://([^:\n]+):(\d+):(\d+)\s+(.+)$", log, re.M):
              rel = m.group(1).replace(ws, "")
              print(f"::error file={rel},line={m.group(2)},col={m.group(3)},title=DeviceBuildKotlin::{m.group(4)}")
              emitted += 1
              if emitted >= 30: break
          if emitted == 0:
              tail = " | ".join(l.strip() for l in log.splitlines()[-30:] if l.strip())
              print(f"::error title=DeviceBuild::{tail[:1200]}")
          PY
            exit $STATUS
          }
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ inputs.emulator_api_level || 29 }}
          arch: x86_64
          disable-animations: true
          script: |
            set -o pipefail
            mkdir -p app/build/outputs/androidTest-results
            adb install -r -t app/build/outputs/apk/debug/app-debug.apk || true
            if [ -f "/tmp/nnue-cache/${NNUE_NET_NAME}" ]; then
              adb push "/tmp/nnue-cache/${NNUE_NET_NAME}" "/data/local/tmp/${NNUE_NET_NAME}" || true
              adb shell run-as com.example.chessmentor sh -c "mkdir -p files/nnue && cp /data/local/tmp/${NNUE_NET_NAME} files/nnue/${NNUE_NET_NAME}" || true
            fi
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.injected.build.abi=x86_64 --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx3072m -Dfile.encoding=UTF-8" || {
              STATUS=$?
              adb logcat -d -t 1000 > app/build/outputs/androidTest-results/emulator-logcat.txt || true
              exit $STATUS
            }
      - name: Identify failing device tests
        if: failure()
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = list(Path('app/build/outputs/androidTest-results/connected').rglob('TEST-*.xml'))
