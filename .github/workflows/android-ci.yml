                  for problem in [*case.findall('failure'), *case.findall('error')]:
                      detail = (problem.text or problem.get('message') or '').strip()
                      excerpt = '\n'.join(detail.splitlines()[:18])[:1600]
                      msg = f"{case.get('classname')}.{case.get('name')}: {excerpt}"
                      print('::error::' + msg.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
